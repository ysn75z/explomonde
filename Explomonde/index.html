<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explomonde - Recherche de pays</title>

    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
</head>

<body>

<header>
    <h1>Explomonde</h1>

    <nav>
        <a href="#contenu">Aller au contenu</a>
        <a href="#">Accueil</a>
        <a href="#">Pays</a>
        <a href="#">Régions</a>
    </nav>
</header>

<main id="contenu">

    <section>
        <h2>Recherche</h2>

        <form>
            <label for="recherche">Rechercher un pays :</label>

            <input
                type="text"
                id="recherche"
                name="recherche"
            >

            <button type="submit">Rechercher</button>
        </form>
    </section>

    <section>
        <h2>Résultats</h2>

        <label for="filtre-region">Filtrer par région :</label>

        <select id="filtre-region">
            <option value="Toutes">Toutes</option>
            <option value="Europe">Europe</option>
            <option value="Asie">Asie</option>
            <option value="Afrique">Afrique</option>
            <option value="Amérique du Nord">Amérique du Nord</option>
            <option value="Amérique du Sud">Amérique du Sud</option>
            <option value="Océanie">Océanie</option>
        </select>

        <div id="statut" role="status" aria-live="polite">
            Résultats prêts
        </div>

        <div id="grille" class="grille"></div>

        <article id="detail"></article>

    </section>

</main>

<footer>
    <p>Explomonde 2026</p>
</footer>

<script type="module" src="js/main.js"></script>

</body>
</html>
